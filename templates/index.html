<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="GrowMate device WiFi configuration">
    <title>GrowMate Setup</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="wrap">
        <header class="header">
            <h1>GrowMate Setup</h1>
            <p class="hint">Enter your WiFi credentials to connect this device to your network.</p>
        </header>
        
        <main>
            <div class="card">
                <!-- Native form submission (works without JavaScript) -->
                <form id="configForm" action="/api/config" method="POST">
                    <label for="wifiSsid">WiFi Network Name (SSID)</label>
                    <input 
                        id="wifiSsid" 
                        name="wifiSsid" 
                        type="text" 
                        placeholder="Enter your WiFi network name" 
                        autocomplete="off" 
                        required
                        aria-required="true">
                    
                    <label for="wifiPassword">WiFi Password</label>
                    <input 
                        id="wifiPassword" 
                        name="wifiPassword" 
                        type="password" 
                        placeholder="Enter your WiFi password" 
                        autocomplete="new-password">
                    <p class="hint">Leave blank if your network has no password.</p>
                    
                    <button type="submit">Save and Continue</button>
                </form>
                
                <div id="status" role="status" aria-live="polite"></div>
            </div>
        </main>
    </div>
    
    <!-- Progressive enhancement: AJAX submission for better UX -->
    <script src="/static/js/setup.js"></script>
</body>
</html>
