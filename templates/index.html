<!doctype html>
<html>
<head>
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width,initial-scale=1'>
    <title>GrowMate Setup</title>
    <style>
        body{font-family:system-ui,sans-serif;margin:0;background:#0f172a;color:#e2e8f0}
        .wrap{max-width:760px;margin:0 auto;padding:24px}
        .card{background:#111827;border:1px solid #1f2937;border-radius:18px;padding:20px}
        h1{margin-top:0}
        label{display:block;margin:14px 0 6px}
        input,select{width:100%;padding:12px;border-radius:12px;border:1px solid #334155;background:#020617;color:#e2e8f0}
        button{margin-top:18px;padding:12px 16px;border:0;border-radius:12px;background:#22c55e;color:#052e16;font-weight:700;cursor:pointer}
        button.secondary{background:#1e293b;color:#e2e8f0}
        .row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
        .hint{color:#94a3b8;font-size:14px}
        #status{margin-top:16px;white-space:pre-wrap}
    </style>
</head>
<body>
    <div class='wrap'>
        <div class='card'>
            <h1>GrowMate onboarding</h1>
            <p class='hint'>Connect this device to WiFi. Device identity and cloud-side configuration are managed by GrowMate, not by the end user.</p>
            <label>Device ID</label>
            <input id='deviceId' disabled>
            <button class='secondary' id='scanBtn' type='button'>Scan WiFi</button>
            <label>WiFi network</label>
            <select id='ssid'></select>
            <label>WiFi password</label>
            <input id='password' type='password' placeholder='WiFi password'>
            <button id='saveBtn' type='button'>Save and continue</button>
            <div id='status' class='hint'></div>
        </div>
    </div>
    <script>
        async function getConfig(){const r=await fetch('/api/config');return r.json()}
        async function scan(){
            status('Scanning WiFi...');
            const r=await fetch('/api/networks');
            const items=await r.json();
            const el=document.getElementById('ssid');
            el.innerHTML='';
            items.networks.forEach(n=>{
                const o=document.createElement('option');
                o.value=n.ssid;
                o.textContent=`${n.ssid} (${n.rssi} dBm)`;
                el.appendChild(o)
            });
            if(!items.networks.length){
                const o=document.createElement('option');
                o.value='';
                o.textContent='No networks found';
                el.appendChild(o)
            }
            status('WiFi scan complete.')
        }
        function status(v){document.getElementById('status').textContent=v}
        function setValue(id,v){document.getElementById(id).value=v ?? ''}
        async function load(){const cfg=await getConfig();setValue('deviceId',cfg.deviceId);await scan()}
        async function save(){
            const body={wifiSsid:document.getElementById('ssid').value,wifiPassword:document.getElementById('password').value};
            status('Saving configuration...');
            const r=await fetch('/api/config',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
            const json=await r.json();
            status(json.message || 'Saved');
        }
        document.getElementById('scanBtn').onclick=scan;
        document.getElementById('saveBtn').onclick=save;
        load();
    </script>
</body>
</html>
